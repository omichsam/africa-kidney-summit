name: Deploy to Namecheap cPanel (FTP fallback)

# Manual-only now that SSH/rsync (deploy-cpanel-ssh.yml) handles automatic
# deploys on push -- kept around as a fallback if SSH access ever breaks.
on:
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP/SFTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            nginx.conf.example
            .claude/**
