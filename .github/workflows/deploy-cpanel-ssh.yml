name: Deploy to Namecheap cPanel (SSH)

# Manual-only: SSH auth to this host has been failing (Permission denied even
# with a freshly authorized key), most likely because cPanel's SSH Access page
# here only manages keys for cPanel's own Git feature rather than granting a
# real external SSH/SFTP login. FTP (deploy-cpanel.yml) is the primary
# pipeline until that's confirmed/resolved with hosting support.
on:
  workflow_dispatch:

jobs:
  rsync-deploy:
    name: rsync over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git*' --exclude='.github' --exclude='README.md' --exclude='nginx.conf.example' --exclude='.gitignore'
          path: ./
          remote_path: ${{ secrets.SSH_TARGET_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT || 22 }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
